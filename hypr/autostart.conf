#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
# exec-once = hyprpaper
# awww-daemon for wallpaper management (walset workflow)
exec-once = sleep 1 && awww-daemon
exec-once = sleep 1 && awww img ~/Pictures/wallpaper/wall.jpg
exec-once = waybar
exec-once = swaync
exec-once = blueman-applet
exec-once = cava
exec-once = gsettings set org.gnome.nautilus.preferences click-policy 'single'
# kwalletd removed — GDM starts gnome-keyring-daemon automatically